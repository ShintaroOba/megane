[package]
name = "megane"
version = "0.2.0"
edition = "2021"
description = "A lightweight viewer that renders Claude Code sessions (Markdown, Mermaid, HTML, images) next to your terminal"
license = "MIT"
repository = "https://github.com/ShintaroOba/megane"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "sync"] }
tokio-stream = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
