<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEGANE</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" media="(prefers-color-scheme: light)" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<link rel="stylesheet" media="(prefers-color-scheme: dark)" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
:root {
  --bg: #fbfaf8; --surface: #ffffff; --surface-2: #f3f1ed; --border: #e4e0d8;
  --text: #1f1d1a; --muted: #6f6a62; --accent: #c4622d; --accent-soft: #f6e4d8;
  --user-bg: #eef2f7; --error: #b3261e; --ok: #2e7d4f; --wait: #7c4dde;
  --mono: "Cascadia Code", "Cascadia Mono", Consolas, "BIZ UDGothic", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1918; --surface: #232220; --surface-2: #2c2a27; --border: #3a3733;
    --text: #ece8e1; --muted: #a39d93; --accent: #e08a5a; --accent-soft: #3d2a1f;
    --user-bg: #252b33; --error: #f2817a; --ok: #7fcf9c; --wait: #b296f5;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.7 var(--sans); }
a { color: var(--accent); }
header {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
}
header .brand { font-weight: 700; letter-spacing: .02em; text-decoration: none; color: var(--text); }
header .brand { display: flex; align-items: center; gap: 8px; }
header .brand img { width: 22px; height: 22px; }
header .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
header label { font-size: 13px; color: var(--muted); display: flex; gap: 4px; align-items: center; cursor: pointer; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.live { background: var(--ok); }
main { max-width: 920px; margin: 0 auto; padding: 16px 16px 160px; }

header .icon { font: inherit; font-size: 18px; line-height: 1; background: none; border: 1px solid transparent; border-radius: 6px; color: var(--text); cursor: pointer; padding: 3px 7px; }
header .icon:hover { border-color: var(--border); }

/* sessions: the sidebar and the list page */
.filter { width: 100%; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 14px; margin-bottom: 8px; }
#side { position: fixed; top: var(--head, 49px); left: 0; bottom: 0; width: 300px; background: var(--surface); border-right: 1px solid var(--border); display: none; flex-direction: column; z-index: 8; }
body.side-open #side { display: flex; }
@media (min-width: 1100px) {
  body.side-open main { margin-left: max(300px, calc((100vw - 920px) / 2)); }
  body.side-open #asks { left: calc(50% + 150px); width: min(760px, calc(100vw - 332px)); }
}
@media (max-width: 1099px) { body.side-open #side { box-shadow: 0 12px 40px rgb(0 0 0 / .25); } }
#side .filter { margin: 10px 10px 4px; width: auto; }
#side .list { overflow-y: auto; padding: 0 6px 16px; flex: 1; }
.group { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; padding: 12px 8px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session { display: flex; gap: 8px; align-items: flex-start; padding: 7px 8px; border-radius: 8px; text-decoration: none; color: var(--text); border: 1px solid transparent; }
.session:hover { background: var(--surface-2); }
.session[aria-current] { background: var(--accent-soft); border-color: var(--accent); }
.session .st { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; border: 1px solid var(--border); }
.session .st.busy { background: var(--accent); border-color: var(--accent); }
.session .st.waiting { background: var(--wait); border-color: var(--wait); }
.session .st.idle, .session .st.running { background: var(--ok); border-color: var(--ok); }
.session .b { min-width: 0; flex: 1; }
.session .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; font-weight: 600; line-height: 1.45; }
.session .m { display: block; font-size: 11px; color: var(--muted); }
main .session { padding: 9px 12px; }
main .session .t { font-size: 15px; }
main .session .m { font-size: 12px; }

/* conversation */
.turn { margin: 18px 0; }
.turn.user { background: var(--user-bg); border-radius: 12px; padding: 10px 16px; }
.turn.user::before { content: "You"; display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3 { line-height: 1.35; margin: 1.2em 0 .5em; }
.md h1 { font-size: 1.45em; } .md h2 { font-size: 1.25em; } .md h3 { font-size: 1.08em; }
.md table { border-collapse: collapse; margin: .8em 0; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); }
.md code { font-family: var(--mono); font-size: .88em; background: var(--surface-2); padding: .1em .35em; border-radius: 4px; }
.md pre { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; line-height: 1.5; }
.md pre code { background: none; padding: 0; font-size: 13px; }
.md pre code.hljs { padding: 0; background: none; }
.md blockquote { margin: .8em 0; padding: 0 1em; border-left: 3px solid var(--border); color: var(--muted); }
.md img, .img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); cursor: zoom-in; }
.figure { margin: .8em 0; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); overflow: hidden; }
.figure .bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px; font-size: 12px; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--border); }
.figure .bar button { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 5px; padding: 1px 8px; cursor: pointer; }
.figure .view { padding: 12px; overflow-x: auto; text-align: center; }
.figure .view svg { max-width: 100%; height: auto; }
.figure iframe { width: 100%; border: 0; display: block; background: #fff; min-height: 80px; }
.figure pre { margin: 0; border: 0; border-radius: 0; }
.figure .err { color: var(--error); font-family: var(--mono); font-size: 12px; text-align: left; white-space: pre-wrap; }

/* tools */
.tool { margin: 4px 0; font-size: 13px; }
.tool summary { cursor: pointer; color: var(--muted); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; list-style: none; }
.tool summary::before { content: "▸ "; }
.tool[open] summary::before { content: "▾ "; }
.tool summary b { color: var(--text); font-weight: 600; }
.tool .out { margin: 4px 0 8px 14px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; max-height: 360px; overflow: auto; }
.tool.error summary { color: var(--error); }
body.hide-tools .tool { display: none; }

/* paste tray */
#tray { position: fixed; right: 16px; bottom: calc(var(--composer-h, 0px) + 16px); display: flex; flex-direction: column; gap: 8px; z-index: 10; max-width: min(420px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px; box-shadow: 0 6px 24px rgb(0 0 0 / .15); font-size: 12px; }
.toast img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; flex: none; }
.toast code { font-family: var(--mono); word-break: break-all; }
.toast button { font: inherit; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 6px; padding: 2px 8px; cursor: pointer; flex: none; }
.hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); font-size: 12px; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: 999px; padding: 4px 14px; white-space: nowrap; }
body.dragging::after { content: "ここにドロップして画像を Claude に渡す"; position: fixed; inset: 12px; border: 3px dashed var(--accent); border-radius: 16px; background: color-mix(in srgb, var(--accent-soft) 70%, transparent); display: grid; place-items: center; font-size: 20px; font-weight: 700; z-index: 20; }
#zoom { position: fixed; inset: 0; background: rgb(0 0 0 / .85); display: none; place-items: center; z-index: 30; cursor: zoom-out; padding: 16px; }
#zoom.on { display: grid; }
#zoom img { max-width: 100%; max-height: 100%; }
.empty { color: var(--muted); text-align: center; padding: 48px 0; }

/* composer: typing into the session's own terminal */
#composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--border); padding: 10px 16px 8px; }
#composer[hidden] { display: none; }
#composer .row { max-width: 920px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
 (min-width: 1100px) { body.side-open #composer { left: 300px; } }
#composer textarea { flex: 1; font: inherit; font-size: 14px; line-height: 1.5; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; resize: none; max-height: 40vh; min-height: 2.6em; }
#composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#composer button { font: inherit; font-size: 13px; border-radius: 8px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); flex: none; }
#composer button.send { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
#composer .foot { max-width: 920px; margin: 4px auto 0; font-size: 11px; color: var(--muted); display: flex; gap: 12px; }
#composer .foot .err { color: var(--error); }
#composer .foot .grow { flex: 1; }
body.composing .hint { display: none; }

/* answering from the browser */
#asks { position: fixed; left: 50%; bottom: calc(var(--composer-h, 0px) + 52px); transform: translateX(-50%); width: min(760px, calc(100vw - 32px)); max-height: 72vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; z-index: 15; }
.ask { background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: 12px 16px; box-shadow: 0 10px 32px rgb(0 0 0 / .22); }
.ask.sent { opacity: .55; }
.ask .kind { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
.ask .what { font-weight: 600; margin: 2px 0 8px; word-break: break-all; }
.ask .what code { font-family: var(--mono); font-size: 13px; }
.ask .q { margin: 10px 0; }
.ask .chip { display: inline-block; font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; margin-right: 6px; }
.ask .opt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 10px; margin: 4px 0; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.ask .opt:hover { border-color: var(--accent); }
.ask .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.ask .opt input[type=radio], .ask .opt input[type=checkbox] { margin-top: 5px; accent-color: var(--accent); }
.ask .opt .d { display: block; font-size: 12px; color: var(--muted); }
.ask .opt input[type=text] { width: 100%; margin-top: 4px; }
.ask input[type=text], .ask textarea { font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; width: 100%; }
.ask textarea { min-height: 3.2em; resize: vertical; }
.ask .plan { max-height: 40vh; overflow: auto; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin: 6px 0; }
.ask details pre { font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; max-height: 30vh; overflow: auto; background: var(--bg); border-radius: 6px; padding: 8px; margin: 4px 0; }
.ask .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.ask .actions .grow { flex: 1; }
.ask button { font: inherit; font-size: 13px; border-radius: 8px; padding: 5px 14px; cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
.ask button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.ask button.danger { color: var(--error); }
.ask button.link { background: none; border: none; color: var(--muted); text-decoration: underline; padding: 5px 4px; }
.ask .missing { outline: 2px solid var(--error); outline-offset: 2px; border-radius: 8px; }
</style>
</head>
<body>
<header>
  <button class="icon" id="sideToggle" type="button" title="セッション一覧" hidden>☰</button>
  <a class="brand" href="/"><img src="/icon.svg" alt="">MEGANE</a>
  <span class="dot" id="dot"></span>
  <span class="title" id="title"></span>
  <label id="answerToggle" hidden title="オンでタブが表示されている間は、Claude の質問・プラン承認・実行許可をこの画面で答えます"><input type="checkbox" id="answerHere" checked>ブラウザで回答</label>
  <label id="toolToggle" hidden><input type="checkbox" id="showTools" checked>ツール</label>
</header>
<aside id="side"></aside>
<main id="main"></main>
<form id="composer" hidden autocomplete="off">
  <div class="row">
    <textarea id="composeText" rows="1" placeholder="Claude への入力（ターミナルにそのまま送られます）"></textarea>
    <button type="button" id="composeStop" title="Esc を送って Claude を止める">中断</button>
    <button type="submit" class="send">送信</button>
  </div>
  <div class="foot"><span>Enter で送信 · Shift+Enter で改行 · 空欄で Esc を押すと中断 · 画像は Ctrl+V</span><span class="grow"></span><span id="composeVia"></span><span class="err" id="composeErr"></span></div>
</form>
<div id="asks"></div>
<div id="tray"></div>
<div id="zoom"><img alt=""></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'strict' });

// ---------- markdown ----------
const isLocalPath = p => /^([A-Za-z]:[\\/]|\/(?!\/)|~[\\/])/.test(p);
marked.use({
  gfm: true,
  walkTokens(t) {
    if (t.type === 'image' && isLocalPath(t.href)) t.href = '/api/file?path=' + encodeURIComponent(t.href);
  },
  renderer: {
    code(code, lang) {
      const l = (lang || '').trim().split(/\s+/)[0].toLowerCase();
      if (l === 'mermaid' || l === 'html' || l === 'svg') {
        return `<div class="figure-slot" data-kind="${l}" data-src="${encodeURIComponent(code)}"></div>`;
      }
      const hl = l && hljs.getLanguage(l) ? hljs.highlight(code, { language: l }).value : hljs.highlightAuto(code).value;
      return `<pre><code class="hljs">${hl}</code></pre>`;
    }
  }
});

let figSeq = 0;
function figure(kind, src) {
  const box = h('div', 'figure'), bar = h('div', 'bar'), view = h('div', 'view');
  const toggle = h('button', null, 'ソース');
  bar.append(h('span', null, kind), toggle);
  const source = h('pre'); source.append(h('code', null, src));
  source.hidden = true;
  toggle.onclick = () => { const s = source.hidden; source.hidden = !s; view.hidden = s; toggle.textContent = s ? '図' : 'ソース'; };
  box.append(bar, view, source);
  if (kind === 'mermaid') {
    const id = 'mmd' + (++figSeq);
    mermaid.render(id, src).then(r => { view.innerHTML = r.svg; })
      .catch(e => { view.append(h('div', 'err', String(e.message || e))); document.getElementById('d' + id)?.remove(); });
  } else {
    view.style.padding = '0';
    const fid = 'f' + (++figSeq);
    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.dataset.fid = fid;
    const doc = kind === 'svg' ? `<body style="margin:0;display:grid;place-items:center">${src}</body>` : src;
    frame.srcdoc = doc + `<script>(()=>{const s=()=>parent.postMessage({megane:'${fid}',h:document.documentElement.scrollHeight},'*');new ResizeObserver(s).observe(document.documentElement);addEventListener('load',s);})()<\/script>`;
    view.append(frame);
  }
  return box;
}
addEventListener('message', e => {
  if (!e.data || !e.data.megane) return;
  const f = document.querySelector(`iframe[data-fid="${e.data.megane}"]`);
  if (f) f.style.height = Math.min(Math.max(e.data.h, 80), 2400) + 'px';
});

function markdown(text) {
  const div = h('div', 'md');
  div.innerHTML = DOMPurify.sanitize(marked.parse(text));
  div.querySelectorAll('.figure-slot').forEach(slot => slot.replaceWith(figure(slot.dataset.kind, decodeURIComponent(slot.dataset.src))));
  div.querySelectorAll('img').forEach(img => img.onclick = () => zoom(img.src));
  return div;
}
function image(b) {
  const img = h('img', 'img'); img.src = `data:${b.media_type};base64,${b.data}`; img.onclick = () => zoom(img.src); return img;
}
function zoom(src) { const z = $('#zoom'); $('img', z).src = src; z.classList.add('on'); }
$('#zoom').onclick = () => $('#zoom').classList.remove('on');

// ---------- session view ----------
function sessionView(id) {
  const main = $('#main'), dot = $('#dot');
  $('#toolToggle').hidden = false;
  const showTools = $('#showTools');
  try { showTools.checked = localStorage.getItem('megane.tools') !== '0'; } catch {}
  const applyTools = () => { document.body.classList.toggle('hide-tools', !showTools.checked); try { localStorage.setItem('megane.tools', showTools.checked ? '1' : '0'); } catch {} };
  showTools.onchange = applyTools; applyTools();

  let turn = null, pendingTools = [], ready = false;
  const nearBottom = () => innerHeight + scrollY >= document.body.scrollHeight - 160;
  const newTurn = role => { turn = h('section', 'turn ' + role); turn.dataset.role = role; main.append(turn); return turn; };

  function addMessage(msg) {
    const toolOnly = msg.blocks.every(b => b.type === 'tool_result');
    const role = msg.role === 'user' && !toolOnly ? 'user' : 'assistant';
    const stick = !ready || nearBottom();
    if (!turn || turn.dataset.role !== role || role === 'user') newTurn(role);
    if (role === 'user') pendingTools = [];
    for (const b of msg.blocks) {
      if (b.type === 'text') turn.append(markdown(b.text));
      else if (b.type === 'image') turn.append(image(b));
      else if (b.type === 'tool_use') {
        const d = h('details', 'tool'), s = h('summary');
        s.append(h('b', null, b.name), ' ' + b.summary);
        d.append(s); turn.append(d); pendingTools.push(d);
      } else if (b.type === 'tool_result') {
        const d = pendingTools.shift() || turn.appendChild(h('details', 'tool'));
        if (b.is_error) d.classList.add('error');
        if (b.text) d.append(h('div', 'out', b.text));
        // Images a tool returned (screenshots, Read of a PNG) are worth seeing without expanding.
        for (const img of b.images) d.after(image(img));
      }
    }
    if (stick && ready) scrollTo(0, document.body.scrollHeight);
  }

  const asks = setupAsks(id);
  const es = new EventSource(`/api/s/${id}/events`);
  es.addEventListener('meta', e => { const m = JSON.parse(e.data); $('#title').textContent = m.title || m.id; document.title = (m.title || 'Session') + ' · MEGANE'; asks.setViewer(m.viewer); });
  es.addEventListener('pending', e => asks.add(JSON.parse(e.data)));
  es.addEventListener('resolved', e => asks.remove(JSON.parse(e.data).id));
  es.addEventListener('reset', () => { main.replaceChildren(); turn = null; pendingTools = []; ready = false; });
  es.addEventListener('msg', e => addMessage(JSON.parse(e.data)));
  es.addEventListener('ready', () => { ready = true; if (!main.children.length) main.append(h('p', 'empty', 'まだメッセージがありません')); scrollTo(0, document.body.scrollHeight); });
  es.onopen = () => { dot.classList.add('live'); main.replaceChildren(); turn = null; pendingTools = []; ready = false; asks.clear(); };
  es.onerror = () => dot.classList.remove('live');

  const hint = h('div', 'hint', 'Ctrl+V / ドロップで画像を Claude に渡せます');
  document.body.append(hint);
  setupPaste(id, hint, setupComposer(id));
}

// ---------- answering questions, plans and permissions ----------
// The server only routes a question here while some viewer reports itself "active" (tab
// visible and the toggle on); otherwise Claude Code asks in the terminal as usual.
function setupAsks(id) {
  const box = $('#asks'), toggle = $('#answerHere');
  $('#answerToggle').hidden = false;
  try { toggle.checked = localStorage.getItem('megane.answer') !== '0'; } catch {}
  let viewer = null;
  const post = (path, body) => fetch(`/api/s/${id}/${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const sendPresence = () => { if (viewer) post('presence', { viewer, active: toggle.checked && document.visibilityState === 'visible' }).catch(() => {}); };
  toggle.onchange = () => { try { localStorage.setItem('megane.answer', toggle.checked ? '1' : '0'); } catch {} sendPresence(); };
  document.addEventListener('visibilitychange', sendPresence);
  const flag = () => { document.title = (box.children.length ? '❓ ' : '') + document.title.replace(/^❓ /, ''); };

  function reply(card, answer) {
    card.classList.add('sent');
    card.querySelectorAll('button, input, textarea').forEach(el => el.disabled = true);
    post('answer', { id: Number(card.dataset.pid), answer }).then(r => { if (!r.ok) { card.remove(); flag(); } });
  }
  const button = (label, cls, onclick) => { const b = h('button', cls, label); b.type = 'button'; b.onclick = onclick; return b; };
  const terminal = card => button('ターミナルで答える', 'link', () => reply(card, { action: 'terminal' }));

  function question(card, p) {
    card.append(h('div', 'kind', 'Claude からの質問'));
    const qs = p.tool_input.questions || [];
    const groups = qs.map((q, i) => {
      const g = h('div', 'q');
      const title = h('div', 'what');
      if (q.header) title.append(h('span', 'chip', q.header));
      title.append(q.question);
      g.append(title);
      const type = q.multiSelect ? 'checkbox' : 'radio';
      for (const o of q.options || []) {
        const l = h('label', 'opt'), inp = h('input');
        inp.type = type; inp.name = `q${p.id}-${i}`; inp.value = o.label;
        const t = h('span'); t.append(o.label);
        if (o.description) t.append(h('span', 'd', o.description));
        l.append(inp, t); g.append(l);
      }
      const l = h('label', 'opt'), inp = h('input'), t = h('span'), other = h('input');
      inp.type = type; inp.name = `q${p.id}-${i}`; inp.value = '';
      other.type = 'text'; other.placeholder = 'その他（自由に入力）';
      other.oninput = () => { inp.checked = other.value.trim() !== ''; };
      t.append('その他', other); l.append(inp, t); g.append(l);
      card.append(g);
      return { q, g, other };
    });
    const submit = () => {
      const answers = {};
      let ok = true;
      for (const { q, g, other } of groups) {
        const picked = [...g.querySelectorAll('input:checked')].map(i => i.value || other.value.trim()).filter(Boolean);
        g.classList.toggle('missing', !picked.length);
        if (!picked.length) ok = false;
        answers[q.question] = picked.join(', ');
      }
      if (ok) reply(card, { action: 'answer', answers });
    };
    const actions = h('div', 'actions');
    actions.append(button('回答する', 'primary', submit), button('答えない', '', () => reply(card, { action: 'dismiss' })), h('span', 'grow'), terminal(card));
    card.append(actions);
  }

  function plan(card, p) {
    card.append(h('div', 'kind', 'プランの承認'));
    const body = h('div', 'plan');
    body.append(markdown(p.tool_input.plan || ''));
    const feedback = h('textarea');
    feedback.placeholder = '差し戻す場合の指示（任意）';
    const actions = h('div', 'actions');
    actions.append(
      button('承認して進める', 'primary', () => reply(card, { action: 'approve' })),
      button('差し戻す', 'danger', () => reply(card, { action: 'reject', message: feedback.value })),
      h('span', 'grow'), terminal(card));
    card.append(body, feedback, actions);
  }

  function permission(card, p) {
    card.append(h('div', 'kind', '実行の許可'));
    const input = p.tool_input || {};
    const main = input.command || input.file_path || input.path || input.url || input.pattern || '';
    const what = h('div', 'what');
    what.append(h('span', 'chip', p.tool_name));
    if (main) what.append(h('code', null, String(main)));
    if (input.description) what.append(h('span', 'd', ' — ' + input.description));
    const details = h('details'), sum = h('summary', null, '入力をすべて見る'), pre = h('pre', null, JSON.stringify(input, null, 2));
    sum.style.cssText = 'cursor:pointer;font-size:12px;color:var(--muted)';
    details.append(sum, pre);
    const reason = h('input');
    reason.type = 'text'; reason.placeholder = '拒否の理由・代わりにしてほしいこと（任意）';
    const actions = h('div', 'actions');
    actions.append(button('許可', 'primary', () => reply(card, { action: 'allow' })));
    if (Array.isArray(p.suggestions) && p.suggestions.length) {
      actions.append(button('常に許可', '', () => reply(card, { action: 'always' })));
    }
    actions.append(button('拒否', 'danger', () => reply(card, { action: 'deny', message: reason.value })), h('span', 'grow'), terminal(card));
    card.append(what, details, reason, actions);
  }

  return {
    setViewer(v) { viewer = v; sendPresence(); },
    clear() { box.replaceChildren(); flag(); },
    add(p) {
      if (box.querySelector(`[data-pid="${p.id}"]`)) return;
      const card = h('div', 'ask');
      card.dataset.pid = p.id;
      ({ question, plan, permission })[p.kind]?.(card, p);
      box.append(card);
      flag();
      card.querySelector('button.primary')?.focus({ preventScroll: true });
    },
    remove(pid) { box.querySelector(`[data-pid="${pid}"]`)?.remove(); flag(); },
  };
}

// ---------- composer: typing into the session's own terminal ----------
// Shown only when the session runs in a terminal MEGANE can type into (Orca, tmux, WezTerm).
// What is sent arrives in that terminal exactly as if typed there; MEGANE owns nothing.
function setupComposer(id) {
  const form = $('#composer'), text = $('#composeText'), err = $('#composeErr');
  const post = body => fetch(`/api/s/${id}/input`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(async r => { err.textContent = r.ok ? '' : (await r.text() || `送信に失敗しました (${r.status})`); return r.ok; })
    .catch(() => { err.textContent = 'サーバーに届きませんでした'; return false; });
  const fit = () => {
    text.style.height = 'auto';
    text.style.height = text.scrollHeight + 2 + 'px';
    document.documentElement.style.setProperty('--composer-h', form.offsetHeight + 'px');
  };
  const show = kind => {
    form.hidden = false;
    document.body.classList.add('composing');
    $('#composeVia').textContent = `${kind} のターミナルに送信`;
    $('main').style.paddingBottom = '220px';
    fit();
  };
  const check = async () => {
    try {
      const { kind } = await (await fetch(`/api/s/${id}/terminal`)).json();
      if (kind) return show(kind);
    } catch {}
    setTimeout(check, 5000);
  };
  const send = async () => {
    const value = text.value;
    if (!value.trim()) return;
    if (await post({ text: value, submit: true })) { text.value = ''; fit(); }
  };
  form.onsubmit = e => { e.preventDefault(); send(); };
  text.oninput = fit;
  text.onkeydown = e => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    else if (e.key === 'Escape' && !text.value) { e.preventDefault(); post({ key: 'escape' }); }
  };
  $('#composeStop').onclick = () => post({ key: 'escape' });
  addEventListener('resize', () => { if (!form.hidden) fit(); });
  check();
  return {
    active: () => !form.hidden,
    insert(path) {
      const at = text.selectionStart ?? text.value.length;
      const before = text.value.slice(0, at), after = text.value.slice(at);
      const piece = (before && !/\s$/.test(before) ? ' ' : '') + path + ' ';
      text.value = before + piece + after;
      text.focus();
      text.selectionStart = text.selectionEnd = (before + piece).length;
      fit();
    },
  };
}

// ---------- paste & drop ----------
function setupPaste(id, hint, composer) {
  async function upload(file) {
    hint.remove();
    // With a composer, the path goes straight into the message being written; otherwise the
    // prompt hook hands it to Claude with the next prompt.
    const direct = composer.active();
    const res = await fetch(`/api/s/${id}/paste${direct ? '?direct=1' : ''}`, { method: 'POST', headers: { 'Content-Type': file.type }, body: file });
    const toast = h('div', 'toast');
    const thumb = h('img'); thumb.src = URL.createObjectURL(file);
    if (!res.ok) { toast.append(thumb, h('span', null, '保存に失敗しました: ' + res.status)); $('#tray').append(toast); return; }
    const { path } = await res.json();
    const copy = h('button', null, 'パスをコピー');
    copy.onclick = () => navigator.clipboard.writeText(path).then(() => copy.textContent = 'コピー済み');
    if (direct) composer.insert(path);
    const info = h('div'); info.append(h('div', null, direct ? '入力欄にパスを入れました' : '次のプロンプトで Claude に渡します'), h('code', null, path));
    const close = h('button', null, '×'); close.onclick = () => toast.remove();
    toast.append(thumb, info, copy, close);
    $('#tray').append(toast);
    navigator.clipboard.writeText(path).then(() => copy.textContent = 'コピー済み', () => {});
  }
  const images = list => [...list].filter(f => f.type.startsWith('image/'));
  addEventListener('paste', e => images([...e.clipboardData.items].map(i => i.getAsFile()).filter(Boolean)).forEach(upload));
  let depth = 0;
  addEventListener('dragenter', e => { e.preventDefault(); if (++depth === 1) document.body.classList.add('dragging'); });
  addEventListener('dragleave', () => { if (--depth === 0) document.body.classList.remove('dragging'); });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); depth = 0; document.body.classList.remove('dragging'); images(e.dataTransfer.files).forEach(upload); });
}

// ---------- sessions: the sidebar and the list page ----------
const STATUS = { busy: '作業中', waiting: '確認待ち', idle: '待機中', running: '実行中' };
const RUNNING = '実行中のセッション';
const ago = s => { const d = Date.now() / 1000 - s; return d < 60 ? 'たった今' : d < 3600 ? `${Math.floor(d / 60)}分前` : d < 86400 ? `${Math.floor(d / 3600)}時間前` : `${Math.floor(d / 86400)}日前`; };
const projectName = s => (s.cwd && s.cwd.split(/[\\/]/).filter(Boolean).pop()) || s.project;

// Running sessions on top, then each project's history. Refreshes every few seconds.
function sessionList(container, current) {
  const filter = h('input', 'filter'), list = h('div', 'list');
  filter.type = 'search'; filter.placeholder = 'タイトル・プロジェクトで絞り込み';
  container.append(filter, list);
  let sessions = [], last = '';
  const render = () => {
    const q = filter.value.toLowerCase();
    const groups = new Map();
    for (const s of sessions) {
      if (q && !`${s.title} ${s.cwd || s.project}`.toLowerCase().includes(q)) continue;
      const g = s.status ? RUNNING : projectName(s);
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(s);
    }
    const nodes = [];
    for (const [g, items] of groups) {
      const head = h('div', 'group', g);
      if (g !== RUNNING) head.title = items[0].cwd || items[0].project;
      nodes.push(head);
      for (const s of items) {
        const a = h('a', 'session');
        a.href = `/s/${s.id}`;
        if (s.id === current) a.setAttribute('aria-current', 'page');
        const state = s.status && (STATUS[s.status] ? s.status : 'running');
        const dot = h('span', 'st' + (state ? ' ' + state : ''));
        dot.title = state ? STATUS[state] : '終了';
        const body = h('span', 'b');
        const meta = [state && STATUS[state], ago(s.modified), s.status && projectName(s)].filter(Boolean).join(' · ');
        body.append(h('span', 't', s.title || s.id), h('span', 'm', meta));
        a.title = s.cwd || s.project;
        a.append(dot, body);
        nodes.push(a);
      }
    }
    if (!nodes.length) nodes.push(h('p', 'empty', 'セッションが見つかりません'));
    list.replaceChildren(...nodes);
  };
  const refresh = async () => {
    try {
      const text = await (await fetch('/api/sessions')).text();
      if (text === last) return;
      const first = !last;
      last = text; sessions = JSON.parse(text); render();
      if (first) list.querySelector('[aria-current]')?.scrollIntoView({ block: 'center' });
    } catch {}
  };
  filter.oninput = render;
  refresh();
  setInterval(refresh, 5000);
  return filter;
}

function setupSide(id) {
  const btn = $('#sideToggle');
  btn.hidden = false;
  sessionList($('#side'), id);
  let saved = null;
  try { saved = localStorage.getItem('megane.side'); } catch {}
  const wide = matchMedia('(min-width: 1100px)').matches;
  document.body.classList.toggle('side-open', saved ? saved === '1' : wide);
  btn.onclick = () => {
    const open = document.body.classList.toggle('side-open');
    try { localStorage.setItem('megane.side', open ? '1' : '0'); } catch {}
  };
}

function listView() {
  $('#title').textContent = 'セッション一覧';
  $('#dot').classList.add('live');
  sessionList($('#main'), null).focus();
}

document.documentElement.style.setProperty('--head', $('header').offsetHeight + 'px');
const m = location.pathname.match(/^\/s\/([\w-]+)$/);
if (m) { setupSide(m[1]); sessionView(m[1]); } else listView();
</script>
